run:
  shortlist_size: 50
  pages_per_query: 1
  request_timeout_seconds: 30
  request_delay_seconds: 0.5
  max_retries: 3

future_llm:
  max_analyzed_jobs_per_day: 20
  enabled: false

sources:
  jobicy:
    enabled: false
    mode: api_feed
    endpoint: https://jobicy.com/api/v2/remote-jobs
    count: 100
    user_agent: job-assistant/0.1 (+local single-user batch)
  headhunter:
    enabled: true
    mode: api_search
    endpoint: https://api.hh.ru/vacancies
    per_page: 100
    user_agent: "job-assistant/0.1 (local single-user batch)"
    require_authentication: false
    access_token_env: HH_ACCESS_TOKEN
    user_agent_env: HH_USER_AGENT
    search_strings:
      - '("business analyst" OR "business system analyst" OR "business systems analyst" OR "systems analyst" OR "system analyst" OR "requirements analyst" OR "integration analyst" OR "jira administrator" OR "confluence administrator" OR "atlassian administrator")'
      - '("бизнес аналитик" OR "бизнес-аналитик" OR "системный аналитик" OR "аналитик требований" OR "аналитик интеграций" OR "администратор jira" OR "администратор confluence" OR "администратор atlassian")'
    samples:
      - name: remote
        enabled: true
        host: hh.ru
        schedule: remote
        work_formats:
          - REMOTE
        search_field: name
      - name: tbilisi_onsite_hybrid
        enabled: true
        host: headhunter.ge
        area: 2758
        work_formats:
          - ON_SITE
          - HYBRID
        search_field: name
  jooble:
    enabled: false
    mode: api_search
    pages_to_fetch: 1
    result_on_page: 50
    requires_env:
      - JOOBLE_API_KEY
  arbeitnow:
    enabled: false
    mode: api_feed
    pages_to_fetch: 10
  greenhouse:
    enabled: false
    mode: target_company_only
    company_config: config/target_companies.yaml
  lever:
    enabled: false
    mode: target_company_only
    company_config: config/target_companies.yaml
  email:
    enabled: true
    mode: imap_read_only
  linkedin:
    enabled: true
    mode: manual_or_explicit_playwright
    manual_run_only: true

